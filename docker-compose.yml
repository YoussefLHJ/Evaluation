version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: tpdb_postgres
    environment:
      POSTGRES_USER: yousseflhj
      POSTGRES_PASSWORD: youssef-123
      POSTGRES_DB: tpdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yousseflhj"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  tp_network:
    driver: bridge

